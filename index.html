<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Generative Art - طائر العنقاء الناري</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050a;
            font-family: Tahoma, sans-serif;
        }
        canvas {
            display: block;
        }
        .info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 14px;
            border: 1px solid rgba(255, 100, 0, 0.3);
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    <div class="info">حرك المؤشر لتفاعل العنقاء النارية</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // إحداثيات الماوس
        const mouse = {
            x: width / 2,
            y: height / 2
        };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // نظام الجزيئات والنار
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 4 + 1;
                this.speedX = (Math.random() - 0.5) * 4;
                this.speedY = Math.random() * -5 - 1;
                this.color = color;
                this.life = 1;
                this.decay = Math.random() * 0.03 + 0.015;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let particles = [];
        let angle = 0;

        function animate() {
            // تأثير التلاشي الخلفي للحركة النارية
            ctx.fillStyle = 'rgba(5, 5, 10, 0.2)';
            ctx.fillRect(0, 0, width, height);

            angle += 0.05;
            
            // تتبع العنقاء للماوس بنعومة
            let targetX = width / 2 + (mouse.x - width / 2) * 0.3;
            let targetY = height / 2 + (mouse.y - height / 2) * 0.3;

            // رسم أجنحة العنقاء النارية
            let wingSpan = 150 + Math.sin(angle) * 30;
            
            ctx.save();
            ctx.translate(targetX, targetY);

            // توهج قلب العنقاء
            let gradient = ctx.createRadialGradient(0, 0, 5, 0, 0, 80);
            gradient.addColorStop(0, '#ffff55');
            gradient.addColorStop(0.4, '#ff4500');
            gradient.addColorStop(1, 'transparent');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(0, 0, 80, 0, Math.PI * 2);
            ctx.fill();

            // رسم الجناح الأيمن والأيسر بالأكواد الرياضية
            ctx.strokeStyle = '#ff7700';
            ctx.lineWidth = 4;

            for (let i = -1; i <= 1; i += 2) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(
                    i * wingSpan * 0.5, -100 + Math.sin(angle * 2) * 50,
                    i * wingSpan, 50,
                    i * (wingSpan + 50), 100
                );
                ctx.stroke();

                // توليد شرار النار من أطراف الجناح
                particles.push(new Particle(targetX + i * (wingSpan + 30), targetY + 50, Math.random() > 0.5 ? '#ff2200' : '#ffaa00'));
            }

            ctx.restore();

            // تحديث ورسم الجزيئات والنيران
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
