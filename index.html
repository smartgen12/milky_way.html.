<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-looking Phoenix Generative Art - العنقاء الحقيقية بالأكواد</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030307;
            font-family: Tahoma, sans-serif;
        }
        canvas {
            display: block;
        }
        .info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 18px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 14px;
            border: 1px solid rgba(255, 120, 0, 0.4);
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.3);
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    <div class="info">حرك المؤشر وشاهد طائر العنقاء الناري يتبعك بواقعية</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const mouse = {
            x: width / 2,
            y: height / 2,
            targetX: width / 2,
            targetY: height / 2
        };

        window.addEventListener('mousemove', (e) => {
            mouse.targetX = e.clientX;
            mouse.targetY = e.clientY;
        });

        // نظام متطور للجسيمات النارية والشرر المتطاير
        class FireParticle {
            constructor(x, y, isEmber = false) {
                this.x = x;
                this.y = y;
                this.isEmber = isEmber;
                this.size = isEmber ? Math.random() * 3 + 1 : Math.random() * 8 + 3;
                this.speedX = (Math.random() - 0.5) * 6;
                this.speedY = isEmber ? Math.random() * -4 - 2 : Math.random() * -2 - 0.5;
                this.life = 1;
                this.decay = Math.random() * 0.02 + 0.01;
                this.color = Math.random() > 0.4 ? '#ff3300' : (Math.random() > 0.5 ? '#ff9900' : '#ffff66');
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= this.decay;
                if (this.size > 0.3) this.size -= 0.1;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0, this.size), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let particles = [];
        let time = 0;

        // إحداثيات جسم العنقاء لحركة ناعمة تتبع الماوس (Easing)
        let phoenix = {
            x: width / 2,
            y: height / 2
        };

        function animate() {
            // خلفية مظلمة مع تأثير الحركة (Motion Blur)
            ctx.fillStyle = 'rgba(3, 3, 7, 0.25)';
            ctx.fillRect(0, 0, width, height);

            time += 0.06;

            // تتبع العنقاء للماوس بنعومة وبطء واقعي
            phoenix.x += (mouse.targetX - phoenix.x) * 0.08;
            phoenix.y += (mouse.targetY - phoenix.y) * 0.08;

            ctx.save();
            ctx.translate(phoenix.x, phoenix.y);

            // حساب ميلان العنقاء حسب حركة الاتجاه
            let angleX = (mouse.targetX - phoenix.x) * 0.002;
            ctx.rotate(angleX);

            // 1. رسم قلب وقالب العنقاء المضيء
            let coreGlow = ctx.createRadialGradient(0, 0, 5, 0, 0, 100);
            coreGlow.addColorStop(0, '#ffffff');
            coreGlow.addColorStop(0.3, '#ffcc00');
            coreGlow.addColorStop(0.7, '#ff3300');
            coreGlow.addColorStop(1, 'transparent');

            ctx.fillStyle = coreGlow;
            ctx.beginPath();
            ctx.arc(0, 0, 100, 0, Math.PI * 2);
            ctx.fill();

            // 2. رسم الأجنحة بطابع ناري واقعي ومنحنيات معقدة (رفرفة الجناحين)
            let wingSpan = 180 + Math.sin(time * 2) * 45;
            let flapHeight = Math.cos(time * 2) * 60;

            ctx.lineWidth = 6;
            for (let side = -1; side <= 1; side += 2) {
                // تدرج لوني لأجنحة النار
                let wingGradient = ctx.createLinearGradient(0, 0, side * wingSpan, flapHeight);
                wingGradient.addColorStop(0, '#ffcc00');
                wingGradient.addColorStop(0.5, '#ff4400');
                wingGradient.addColorStop(1, 'rgba(255, 0, 0, 0)');

                ctx.strokeStyle = wingGradient;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                // منحنى أجنحة يشبه الطائر الأسطوري الحقيقي
                ctx.bezierCurveTo(
                    side * (wingSpan * 0.4), -80 + flapHeight,
                    side * (wingSpan * 0.8), 30 + flapHeight,
                    side * wingSpan, 80 + flapHeight * 0.5
                );
                ctx.stroke();

                // توليد كثيف للشرر واللهب من أطراف أجنحة العنقاء
                for (let k = 0; k < 3; k++) {
                    particles.push(new FireParticle(
                        phoenix.x + side * (wingSpan * (0.8 + Math.random() * 0.2)),
                        phoenix.y + (80 + flapHeight * 0.5) + (Math.random() - 0.5) * 20,
                        false
                    ));
                }
            }

            // 3. رسم ذيل العنقاء المشتعل المنساب للخلف
            for (let i = 0; i < 5; i++) {
                let tailX = -Math.sin(time - i * 0.2) * 25;
                let tailY = 60 + i * 20;
                particles.push(new FireParticle(phoenix.x + tailX, phoenix.y + tailY, true));
            }

            ctx.restore();

            // تحديث ورسم جميع جزيئات النار
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
