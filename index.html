<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عنقاء ناري واقعي - Phoenix Generative Art</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Tahoma, sans-serif;
        }
        canvas {
            display: block;
        }
        .info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 18px;
            border-radius: 8px;
            pointer-events: none;
            font-size: 14px;
            border: 1px solid rgba(255, 120, 0, 0.4);
            box-shadow: 0 0 15px rgba(255, 69, 0, 0.3);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">حرك الماوس وشاهد العنقاء الناري يتبعك مع ريش مشتعل!</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const mouse = {
            x: width / 2,
            y: height / 2,
            targetX: width / 2,
            targetY: height / 2
        };

        window.addEventListener('mousemove', (e) => {
            mouse.targetX = e.clientX;
            mouse.targetY = e.clientY;
        });

        // نظام جسيمات نار محسّن (مع تأثيرات ريش مشتعل)
        class FireParticle {
            constructor(x, y, isEmber = false, isFeatherFire = false) {
                this.x = x;
                this.y = y;
                this.isEmber = isEmber;
                this.isFeatherFire = isFeatherFire;
                this.size = isEmber ? Math.random() * 2 + 1 : (isFeatherFire ? Math.random() * 5 + 2 : Math.random() * 4 + 1);
                this.speedX = (Math.random() - 0.5) * (isFeatherFire ? 8 : 4);
                this.speedY = isEmber ? Math.random() * -3 - 1 : (isFeatherFire ? Math.random() * -5 - 2 : Math.random() * -2 - 0.5);
                this.life = 1;
                this.decay = Math.random() * 0.03 + 0.01;
                this.color = isFeatherFire ?
                    (Math.random() > 0.5 ? '#ff0000' : '#ff4500') :
                    (Math.random() > 0.4 ? '#ff3300' : (Math.random() > 0.5 ? '#ff9900' : '#ffff66'));
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= this.decay;
                if (this.size > 0.3) this.size -= 0.1;
                this.rotation += this.rotationSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;

                if (this.isFeatherFire) {
                    // شكل ريش مشتعل (مثلث صغير)
                    ctx.beginPath();
                    ctx.moveTo(0, -this.size / 2);
                    ctx.lineTo(-this.size / 2, this.size / 2);
                    ctx.lineTo(this.size / 2, this.size / 2);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    // شكل دائري للنار العادية
                    ctx.beginPath();
                    ctx.arc(0, 0, Math.max(0, this.size), 0, Math.PI * 2);
                    ctx.fill();
                }

                // تأثير توهج (Glow)
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.restore();
            }
        }

        let particles = [];
        let time = 0;

        // جسم العنقاء (مع تفاصيل الجناحين والذيل)
        let phoenix = {
            x: width / 2,
            y: height / 2,
            bodyWidth: 80,
            bodyHeight: 120,
            wingSpan: 200,
            tailLength: 150,
            angle: 0,
            flapAmplitude: 0,
            flapSpeed: 0.1,
            lastFlapTime: 0
        };

        // تحديث رفرفة الأجنحة
        function updateWings() {
            phoenix.angle = (mouse.targetX - phoenix.x) * 0.001;
            phoenix.flapAmplitude = Math.sin(time * phoenix.flapSpeed) * 30;
        }

        // رسم جسم العنقاء
        function drawPhoenix() {
            ctx.save();
            ctx.translate(phoenix.x, phoenix.y);
            ctx.rotate(phoenix.angle);

            // 1. جسم العنقاء (تدرج لوني)
            let bodyGradient = ctx.createLinearGradient(-phoenix.bodyWidth / 2, -phoenix.bodyHeight / 2, phoenix.bodyWidth / 2, phoenix.bodyHeight / 2);
            bodyGradient.addColorStop(0, '#ff6600');
            bodyGradient.addColorStop(0.5, '#ff3300');
            bodyGradient.addColorStop(1, '#cc0000');

            ctx.fillStyle = bodyGradient;
            ctx.beginPath();
            ctx.ellipse(0, 0, phoenix.bodyWidth / 2, phoenix.bodyHeight / 2, 0, 0, Math.PI * 2);
            ctx.fill();

            // 2. رأس العنقاء
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.ellipse(0, -phoenix.bodyHeight / 2 - 20, 15, 25, 0, 0, Math.PI * 2);
            ctx.fill();

            // 3. عين العنقاء
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(5, -phoenix.bodyHeight / 2 - 20, 3, 0, Math.PI * 2);
            ctx.fill();

            // 4. جناحين مع رفرفة
            let wingGradient = ctx.createLinearGradient(0, 0, phoenix.wingSpan / 2, 0);
            wingGradient.addColorStop(0, '#ff9900');
            wingGradient.addColorStop(0.5, '#ff3300');
            wingGradient.addColorStop(1, '#ff0000');

            for (let side = -1; side <= 1; side += 2) {
                ctx.save();
                ctx.scale(side, 1);
                ctx.strokeStyle = wingGradient;
                ctx.lineWidth = 10;

                // منحنى الجناح مع رفرفة
                ctx.beginPath();
                ctx.moveTo(phoenix.bodyWidth / 2, 0);
                ctx.bezierCurveTo(
                    phoenix.wingSpan / 4, -phoenix.flapAmplitude - 30,
                    phoenix.wingSpan / 2, phoenix.flapAmplitude + 20,
                    phoenix.wingSpan / 2, 0
                );
                ctx.stroke();
