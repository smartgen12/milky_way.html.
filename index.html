<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Phoenix - Firebird Animation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        canvas { display: block; }
        .info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            border: 1px solid rgba(255, 120, 0, 0.5);
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">Move your mouse to see the fire phoenix!</div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Handle window resize
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Mouse tracker
        const mouse = {
            x: width / 2,
            y: height / 2,
            targetX: width / 2,
            targetY: height / 2
        };

        window.addEventListener('mousemove', (e) => {
            mouse.targetX = e.clientX;
            mouse.targetY = e.clientY;
        });

        // Particle types
        const PARTICLE_TYPES = {
            BODY: 0,
            FEATHER: 1,
            FIRE: 2
        };

        // Phoenix particle class
        class PhoenixParticle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.baseX = x; // Base position for movement
                this.baseY = y;
                this.type = type;
                this.size = this.getSize();
                this.color = this.getColor();
                this.angle = Math.random() * Math.PI * 2;
                this.frequency = Math.random() * 0.1 + 0.05;
                this.amplitude = Math.random() * 5 + 2;
                this.rotation = 0;
                this.rotationSpeed = (Math.random() - 0.5) * 0.02;
                this.life = 1;
                this.decay = Math.random() * 0.01 + 0.005;
            }

            getSize() {
                switch(this.type) {
                    case PARTICLE_TYPES.BODY: return Math.random() * 4 + 2;
                    case PARTICLE_TYPES.FEATHER: return Math.random() * 6 + 3;
                    case PARTICLE_TYPES.FIRE: return Math.random() * 3 + 1;
                    default: return 2;
                }
            }

            getColor() {
                switch(this.type) {
                    case PARTICLE_TYPES.BODY:
                        return ['#ff4500', '#ff6600', '#ff8c00'][Math.floor(Math.random() * 3)];
                    case PARTICLE_TYPES.FEATHER:
                        return ['#ff9900', '#ffcc00', '#ffff00'][Math.floor(Math.random() * 3)];
                    case PARTICLE_TYPES.FIRE:
                        return ['#ff0000', '#ff3300', '#ff6600'][Math.floor(Math.random() * 3)];
                    default: return '#ff0000';
                }
            }

            update(phoenix) {
                // Smooth follow to phoenix position
                this.baseX = phoenix.x + (this.baseX - phoenix.x) * 0.9;
                this.baseY = phoenix.y + (this.baseY - phoenix.y) * 0.9;

                // Natural swaying motion
                this.x = this.baseX + Math.sin(this.angle + Date.now() * this.frequency) * this.amplitude;
                this.y = this.baseY + Math.cos(this.angle * 0.5 + Date.now() * this.frequency) * this.amplitude * 0.5;

                // Rotation for feathers
                if (this.type === PARTICLE_TYPES.FEATHER) {
                    this.rotation += this.rotationSpeed;
                }

                // Fire particles fade out
                if (this.type === PARTICLE_TYPES.FIRE) {
                    this.life -= this.decay;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                // Glow effect
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.globalAlpha = this.type === PARTICLE_TYPES.FIRE ? this.life : 0.8;
                ctx.fillStyle = this.color;

                // Draw shape based on type
                if (this.type === PARTICLE_TYPES.FEATHER) {
                    // Feather (triangle)
                    ctx.beginPath();
                    ctx.moveTo(0, -this.size);
                    ctx.lineTo(-this.size/2, this.size);
                    ctx.lineTo(this.size/2, this.size);
                    ctx.closePath();
                } else {
                    // Body or fire (circle)
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                }
                ctx.fill();
                ctx.restore();
            }

            isAlive() {
                return this.type !== PARTICLE_TYPES.FIRE || this.life > 0;
            }
        }

        // Phoenix object
        const phoenix = {
            x: width / 2,
            y: height / 2,
            particles: [],
            wingFlap: 0,
            wingFlapSpeed: 0.1,
            lastFireTime: 0,
            fireInterval: 100 // ms between fire emissions
        };

        // Additional fire particles
        let fireParticles = [];

        // Create phoenix shape from particles
        function createPhoenix() {
            phoenix.particles = [];

            // 1. Body particles (central cluster)
            for (let i = 0; i < 80; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 40;
                phoenix.particles.push(new PhoenixParticle(
                    phoenix.x + Math.cos(angle) * distance,
                    phoenix.y + Math.sin(angle) * distance,
                    PARTICLE_TYPES.BODY
                ));
            }

            // 2. Wings (moving particles)
            for (let side = -1; side <= 1; side += 2) {
                for (let i = 0; i < 60; i++) {
                    const wingX = side * (50 + Math.random() * 100);
                    const wingY = -20 + Math.random() * 40;
                    phoenix.particles.push(new PhoenixParticle(
                        phoenix.x + wingX,
                        phoenix.y + wingY,
                        PARTICLE_TYPES.FEATHER
                    ));
                }
            }

            // 3. Tail (long particles)
            for (let i = 0; i < 40; i++) {
                const tailX = -30 - Math.random() * 80;
                const tailY = -10 + Math.random() * 20;
                phoenix.particles.push(new PhoenixParticle(
                    phoenix.x + tailX,
                    phoenix.y + tailY,
                    PARTICLE_TYPES.FEATHER
                ));
            }
        }

        // Main animation loop
        function animate() {
            // Clear canvas with semi-transparent black for motion blur effect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);

            // Update phoenix position
            phoenix.x += (mouse.targetX - phoenix.x) * 0.05;
            phoenix.y += (mouse.targetY - phoenix.y) * 0.05;
            phoenix.wingFlap += phoenix.wingFlapSpeed;

            // Generate fire particles from feathers
